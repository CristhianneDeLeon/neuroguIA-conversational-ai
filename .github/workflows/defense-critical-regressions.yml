name: Defense critical regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile critical Python modules
        run: |
          python -m py_compile core/orchestrator_v2.py
          python -m py_compile memory/user_context_memory.py
          python -m py_compile core/conversational_repair_engine.py
          python -m py_compile core/routine_builder_v2.py
          python -m py_compile scripts/validate_defense_critical_regressions.py
      - name: Critical defense regressions
        run: python scripts/validate_defense_critical_regressions.py
      - name: Routine recall
        run: python scripts/validate_routine_conversational_recall.py
      - name: Routine update
        run: python scripts/validate_routine_conversational_update.py
      - name: Conversation continuity
        run: python scripts/validate_conversation_continuity.py
      - name: Functional support
        run: python scripts/validate_functional_support.py
      - name: Thesis contract
        run: python scripts/validate_thesis_contract.py
      - name: Audit Supabase persistence
        run: python scripts/audit_supabase_persistence.py
      - name: Full defense validation gate
        run: python scripts/run_defense_checks.py
